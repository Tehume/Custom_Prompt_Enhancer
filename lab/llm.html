<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio LLM</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    .lab-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .lab-controls select { max-width: 100%; }
    .progress { margin-top: 8px; font-size: 0.85rem; color: var(--muted); min-height: 1.4em; }
    .runs { list-style: none; padding: 0; margin: 0; }
    .runs li { border-top: 1px solid var(--border); padding: 10px 0; }
    .runs .meta { font-size: 0.8rem; color: var(--muted); }
    .runs .text { font: 13px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
  </style>
</head>
<body>
  <header class="top">
    <h1>Laboratorio: reescritura con LLM local</h1>
    <p>Prueba modelos pequeños en tu navegador. La primera vez descarga el modelo (0,8–1,4 GB);
      después queda en caché. Con WebGPU es mucho más rápido.</p>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Entrada</h2>
      <div class="lab-controls">
        <select id="samples"><option value="">Cargar ejemplo…</option></select>
        <label class="inline"><input type="checkbox" id="pre" checked> Limpiar antes con las reglas</label>
      </div>
      <textarea id="input" spellcheck="false" placeholder="Prompt en inglés…"></textarea>

      <div class="lab-controls">
        <select id="model"></select>
        <select id="device">
          <option value="webgpu">WebGPU</option>
          <option value="wasm">CPU (WASM)</option>
        </select>
        <button type="button" class="primary" id="run">Reescribir</button>
        <button type="button" id="run-all">Todos los ejemplos</button>
      </div>
      <div class="progress" id="progress" role="status"></div>

      <details>
        <summary>Prompt de sistema</summary>
        <pre class="output" id="system"></pre>
      </details>
    </section>

    <section class="panel">
      <h2>Resultados</h2>
      <ul class="runs" id="runs"></ul>
    </section>
  </main>

  <script type="module">
    import { pipeline, TextStreamer } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/dist/transformers.min.js";
    import { MODELS, SYSTEM, buildMessages, cleanOutput } from "../js/llm/prompt.js";
    import { enhance } from "../js/pipeline.js";
    import { loadCounter } from "../js/tokens.js";

    const $ = id => document.getElementById(id);
    $("system").textContent = SYSTEM;
    for (const m of MODELS) $("model").append(new Option(`${m.label} (~${m.mb} MB, ${m.license})`, m.id));
    if (!navigator.gpu) { $("device").value = "wasm"; $("device").options[0].disabled = true; }

    const counter = await loadCounter(async p => (await fetch("../" + p)).json());
    const samples = await (await fetch("../samples/prompts.json")).json();
    for (const s of samples) $("samples").append(new Option(s.title, s.id));
    $("samples").addEventListener("change", e => {
      const s = samples.find(x => x.id === e.target.value);
      if (s) $("input").value = s.prompt;
      e.target.value = "";
    });

    let loaded = { key: null, gen: null };
    async function getGenerator() {
      const key = $("model").value + "|" + $("device").value;
      if (loaded.key === key) return loaded.gen;
      const files = {};
      const gen = await pipeline("text-generation", $("model").value, {
        device: $("device").value,
        dtype: $("device").value === "webgpu" ? "q4f16" : "q4",
        progress_callback: p => {
          if (p.status === "progress" && p.total) {
            files[p.file] = [p.loaded, p.total];
            const [a, b] = Object.values(files).reduce((s, [l, t]) => [s[0] + l, s[1] + t], [0, 0]);
            $("progress").textContent = `Descargando… ${Math.round(a / 1e6)} / ${Math.round(b / 1e6)} MB`;
          }
        },
      });
      loaded = { key, gen };
      return gen;
    }

    async function rewrite(raw, title) {
      const prompt = $("pre").checked ? enhance(raw).text : raw;
      const gen = await getGenerator();
      const li = document.createElement("li");
      const meta = document.createElement("div");
      const text = document.createElement("div");
      meta.className = "meta"; text.className = "text";
      li.append(meta, text);
      $("runs").prepend(li);
      meta.textContent = `${title || "Entrada"} · ${$("model").selectedOptions[0].text} · generando…`;
      let streamed = "";
      let n = 0;
      const t0 = performance.now();
      const streamer = new TextStreamer(gen.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: t => { streamed += t; n++; text.textContent = streamed; },
      });
      const out = await gen(buildMessages($("model").value, prompt), {
        max_new_tokens: 320, do_sample: false, repetition_penalty: 1.05, streamer,
      });
      const result = cleanOutput(out[0].generated_text.at(-1).content);
      const secs = (performance.now() - t0) / 1000;
      text.textContent = result;
      meta.textContent = `${title || "Entrada"} · ${$("model").selectedOptions[0].text} · ` +
        `${secs.toFixed(1)} s · ~${(n / secs).toFixed(1)} tok/s · T5: ${counter.count(prompt)} → ${counter.count(result)}`;
    }

    async function guarded(fn) {
      $("run").disabled = $("run-all").disabled = true;
      try { await fn(); $("progress").textContent = ""; }
      catch (e) { console.error(e); $("progress").textContent = "Error: " + (e.message || e); }
      finally { $("run").disabled = $("run-all").disabled = false; }
    }

    $("run").addEventListener("click", () => guarded(async () => {
      if ($("input").value.trim()) await rewrite($("input").value);
    }));
    $("run-all").addEventListener("click", () => guarded(async () => {
      for (const s of samples) {
        $("progress").textContent = "Ejemplo: " + s.title;
        await rewrite(s.prompt, s.title);
      }
    }));
  </script>
</body>
</html>
