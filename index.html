<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mejorador de prompts</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Mejorador de prompts</h1>
    <p>Para FLUX en Perchance. Todo se ejecuta en tu navegador.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="in-title">
      <div class="panel-head">
        <h2 id="in-title">Entrada</h2>
        <label class="inline">
          <span class="sr-only">Cargar ejemplo</span>
          <select id="samples">
            <option value="">Cargar ejemplo…</option>
          </select>
        </label>
      </div>
      <textarea id="input" spellcheck="false" placeholder="Escribe o pega tu prompt en inglés…"></textarea>
      <div class="meter" id="in-meter"></div>

      <h3>Reglas</h3>
      <ul class="rules" id="rules"></ul>
    </section>

    <section class="panel" aria-labelledby="out-title">
      <div class="panel-head">
        <h2 id="out-title">Prompt mejorado</h2>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-result" aria-selected="true">Resultado</button>
          <button type="button" role="tab" id="tab-diff" aria-selected="false">Cambios</button>
        </div>
      </div>
      <div class="output" id="output" aria-live="polite"></div>
      <div class="meter" id="out-meter"></div>
      <div class="actions">
        <button type="button" class="primary" id="copy">Copiar</button>
        <span class="status" id="copy-status" role="status"></span>
      </div>

      <div id="warnings"></div>
      <h3>Cambios aplicados</h3>
      <ul class="changes" id="changes"></ul>
    </section>
  </main>

  <footer class="foot">
    <p>Recuento con el tokenizador T5 (codificador de texto de FLUX). Avisos a 450 y 512 tokens,
      según el límite medido en Perchance.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
